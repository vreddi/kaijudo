[package]
name = "kaijudo-desktop"
version = "0.0.0"
description = "Kaijudo Desktop"
authors = []
edition = "2021"

[lib]
name = "kaijudo_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
